# REVIEW CANDIDATE ONLY. Not the active root deployment configuration.
[build]
  publish = "dist-release"
  command = "npm run build:release"
[functions]
  directory = "deployment/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
[[redirects]]
  from = "/upload"
  to = "/.netlify/functions/upload"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
